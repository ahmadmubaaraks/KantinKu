<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laporan · KantinKu</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="topbar"><a class="brand" href="/">🍱 <span>KantinKu</span></a><a class="btn light" href="/">Kembali</a></header><main class="container"><section class="hero"><div><p class="eyebrow">LAPORAN PENJUALAN</p><h1>Ringkasan penjualan</h1><p class="muted">Hanya pesanan berstatus selesai yang dihitung.</p></div><div class="hero-emoji">📊</div></section><div class="stat"><small>Total pendapatan selesai</small><b>{{total|rupiah}}</b></div><div class="table-wrap"><table><thead><tr><th>No. Pesanan</th><th>Pemesan</th><th>Waktu</th><th>Total</th></tr></thead><tbody>{% for r in rows %}<tr><td>#{{r.id}}</td><td>{{r.pemesan}}</td><td>{{r.waktu}}</td><td>{{r.total|rupiah}}</td></tr>{% else %}<tr><td colspan="4">Belum ada pesanan selesai.</td></tr>{% endfor %}</tbody></table></div></main></body></html>
